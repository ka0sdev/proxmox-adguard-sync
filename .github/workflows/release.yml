name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release packages
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.packages.outputs.version }}
      artifact_name: ${{ steps.packages.outputs.artifact_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail

          UNFORMATTED="$(gofmt -l .)"

          if [[ -n "${UNFORMATTED}" ]]; then
            echo "The following files require gofmt:"
            echo "${UNFORMATTED}"
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build release packages
        id: packages
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="development-${GITHUB_SHA:0:7}"
          fi

          COMMIT="${GITHUB_SHA}"
          BUILD_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ARTIFACT_NAME="proxmox-adguard-sync-${VERSION}"

          echo "Building version: ${VERSION}"
          echo "Commit: ${COMMIT}"
          echo "Build timestamp: ${BUILD_AT}"

          mkdir -p dist

          for ARCH in amd64 arm64; do
            PACKAGE="proxmox-adguard-sync_${VERSION}_linux_${ARCH}"
            PACKAGE_DIR="dist/${PACKAGE}"

            mkdir -p "${PACKAGE_DIR}"

            GOOS=linux GOARCH="${ARCH}" go build \
              -trimpath \
              -ldflags="\
          -s -w \
          -X main.version=${VERSION} \
          -X main.commit=${COMMIT} \
          -X main.buildAt=${BUILD_AT}" \
              -o "${PACKAGE_DIR}/proxmox-adguard-sync" \
              ./cmd/proxmox-adguard-sync

            cp README.md "${PACKAGE_DIR}/"
            cp LICENSE "${PACKAGE_DIR}/"
            cp .env.example "${PACKAGE_DIR}/"

            tar \
              -C dist \
              -czf "dist/${PACKAGE}.tar.gz" \
              "${PACKAGE}"

            rm -rf "${PACKAGE_DIR}"
          done

          (
            cd dist
            sha256sum *.tar.gz > checksums.txt
          )

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

          echo
          echo "Generated packages:"
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.packages.outputs.artifact_name }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Inspect release files
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; replacing its assets."

            gh release upload \
              "${TAG}" \
              dist/*.tar.gz \
              dist/checksums.txt \
              --clobber
          else
            RELEASE_FLAGS=(
              --verify-tag
              --generate-notes
            )

            if [[ "${TAG}" == *-* ]]; then
              RELEASE_FLAGS+=(
                --prerelease
                --latest=false
              )
            fi

            gh release create \
              "${TAG}" \
              dist/*.tar.gz \
              dist/checksums.txt \
              "${RELEASE_FLAGS[@]}"
          fi

  validate_release:
    name: Validate published release
    if: github.ref_type == 'tag'
    needs:
      - build
      - publish_release

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate live release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ./scripts/validate-release-assets.sh \
            "${GITHUB_REF_NAME}" \
            "${GITHUB_REPOSITORY}"

      - name: Update release validation report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VALIDATED_AT="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          WORKFLOW_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh release view "${TAG}" \
            --json body \
            --jq '.body // ""' \
            > existing-release-body.md

          awk '
            /<!-- release-validation:start -->/ {
              skipping = 1
              next
            }

            /<!-- release-validation:end -->/ {
              skipping = 0
              next
            }

            !skipping {
              print
            }
          ' existing-release-body.md \
            > release-notes-without-validation.md

          cat > validation-report.md <<EOF
          <!-- release-validation:start -->
          ## ✅ Release Asset Validation: PASSED

          Assets were downloaded from the published GitHub Release and independently revalidated.

          **Status:** Live release assets validated ✅  
          **Validated:** ${VALIDATED_AT}  
          **Workflow:** [Build and Release #${GITHUB_RUN_NUMBER}](${WORKFLOW_URL})

          ### Validation Summary

          - All required assets present ✓
          - Checksums verified ✓
          - Archive contents verified ✓
          - Version and build metadata verified ✓
          - Binary architectures validated ✓

          <!-- release-validation:end -->
          EOF

          {
            cat validation-report.md
            printf '\n'
            cat release-notes-without-validation.md
          } > final-release-body.md

          gh release edit "${TAG}" \
            --notes-file final-release-body.md

      - name: Write workflow summary
        shell: bash
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## ✅ Release Asset Validation: PASSED

          **Release:** ${GITHUB_REF_NAME}

          - All required assets present ✓
          - Checksums verified ✓
          - Archive contents verified ✓
          - Version and build metadata verified ✓
          - Binary architectures validated ✓
          EOF